<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Management System</title>

    <link rel="stylesheet" href="style.css">

</head>
<body>

    <div class="container">

        <h1>Employee Management System</h1>

        <div class="form-section">

            <h2>Add Employee</h2>

            <form id="employeeForm">
                <input type="hidden" id="employeeId">

                <input
                    type="text"
                    id="name"
                    placeholder="Name"
                    required
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
                >

                <input
                    type="text"
                    id="department"
                    placeholder="Department"
                    required
                >

                <input
                    type="number"
                    id="salary"
                    placeholder="Salary"
                    required
                >

                <button type="submit" id="submitButton">
                    Add Employee
                </button>

            </form>

        </div>


        <div class="table-section">

            <h2>Employees</h2>

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Salary</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="employeeTable">
                </tbody>

            </table>

        </div>

    </div>


    <script src="script.js"></script>

</body>
